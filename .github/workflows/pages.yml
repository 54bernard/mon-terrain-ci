name: Publier le site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  verifier:
    name: Vérifier et générer le site
    runs-on: ubuntu-latest
    env:
      SITE_URL: ${{ vars.SITE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Générer les pages (valide les données et la sécurité)
        run: node scripts/build.mjs
      - name: Plan du site valide (XML)
        run: python3 -c "import xml.dom.minidom; xml.dom.minidom.parse('_site/sitemap.xml'); print('sitemap ok')"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deployer:
    name: Mettre en ligne
    needs: verifier
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
